services:
  backend:
    build:
      context: ./backend
    container_name: deployflow-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: deployflow-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped